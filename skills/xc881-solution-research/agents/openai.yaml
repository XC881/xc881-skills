interface:
  display_name: "xc881技术方案联网调研"
  short_description: "Intent-routed compact technical research"
  default_prompt: "Use $xc881-solution-research for direct invocation or clear technical-research intent: feasibility, option comparison, stack choice, official docs/standards/advisory checks, or stale external facts. Also use it as bounded delegated research from $xc881-source-article-style or $xc881-requirement-analysis. No code. Spec→RQ→evidence→2-4 options→pick/risk→handoff. Not default requirement analysis. If delegated by requirement-analysis, return to that same requirement run automatically. Papers first for principles; cite only useful sources."
policy:
  allow_implicit_invocation: true
