interface:
  display_name: "xc881源码文章风格"
  short_description: "Function-level source article writing"
  default_prompt: "Use for direct $xc881-source-article-style invocation or clear source-reading/article writing intent: source guide, function-level analysis, call-chain article, chapter draft, or the user's article style. Write compact Chinese source-reading articles from code evidence. If an important specialized term/concept is not introduced in the available article context, automatically use $xc881-solution-research for that bounded term research; do not ask the user to invoke it."
policy:
  allow_implicit_invocation: true
